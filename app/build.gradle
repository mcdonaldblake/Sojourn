// This is the correct structure for a build.gradle file using Groovy and a version catalog

// ✅ 1. The 'plugins' block must be at the top
plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.d308vacationplanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.d308vacationplanner"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.activity
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata

    // Room
    implementation libs.androidx.room.runtime
    implementation libs.appcompat
    annotationProcessor libs.androidx.room.compiler

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}